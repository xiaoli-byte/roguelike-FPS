<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作与场景检视</title>
<style>html,body{margin:0;height:100%;background:#171f29;color:#efe7d3;font:14px "Microsoft YaHei",sans-serif}canvas{width:100%;height:100%;display:block}#controls{position:fixed;top:18px;right:18px;background:#14202bed;padding:16px;border:1px solid #596271;border-radius:8px;max-width:min(330px,calc(100vw - 68px))}select,button,input{font:inherit;margin:4px;padding:5px;background:#283544;color:#fff;border:1px solid #657181}#note{max-width:330px;color:#b3c7d0;line-height:1.6}label{display:inline-block}label[hidden]{display:none}#controls.collapsed label,#controls.collapsed p,#controls.collapsed br{display:none}#toggle-controls{font-size:12px;cursor:pointer;margin-left:12px}#world-layer,#ui-root{display:none}</style></head>
<body><div id="app"><canvas id="game-canvas"></canvas><div id="world-layer"></div><div id="ui-root"></div></div>
<div id="controls"><strong>动作与场景检视</strong><button id="toggle-controls">收起面板</button><br>
<label>内容 <select id="mode"><option value="weapon">持枪与换弹</option><option value="enemy">怪物攻击</option><option value="prop">Hunyuan 道具</option><option value="scene">场景</option></select></label>
<label>对象 <select id="subject"></select></label><label id="hero-control">英雄 <select id="hero"><option value="fox">炎狐</option><option value="bear">岩熊</option><option value="falcon">雷隼</option></select></label><br>
<label id="attack-control" hidden>招式 <select id="attack"></select></label><label id="camera-control" hidden>镜头 <select id="camera"></select></label><label id="distance-control" hidden>炮击距离 <select id="target-distance"><option value="6">6 米</option><option value="20" selected>20 米</option><option value="32">32 米</option></select></label><br>
<label id="progress-control"><span id="progress-label">装填进度</span> <input id="progress" aria-label="动作进度" type="range" min="0" max="1" step="0.001" value="0.5"></label><label><input id="play" type="checkbox" checked>播放动作</label><label id="reload-control"><input id="reload" type="checkbox" checked>换弹</label><label id="aim-control"><input id="aim" type="checkbox">瞄准</label>
<p id="note">正在加载美术资产…</p></div><script type="module" src="/src/dev/detailsLab.ts"></script></body></html>
