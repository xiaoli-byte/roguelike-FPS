<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英雄模型实验页</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 13px "Microsoft YaHei", sans-serif; overflow: hidden; }
      #lab { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #title { position: fixed; left: 10px; top: 8px; font-size: 15px; color: #f3d9a0; z-index: 2; }
      #labels { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); pointer-events: none; }
      #labels div { padding: 30px 10px 0; color: #9a92a6; border: 1px solid #000; }
    </style>
  </head>
  <body>
    <canvas id="lab"></canvas>
    <div id="labels"></div>
    <div id="title"></div>
    <script type="module" src="/src/ui/heroPreview/heroes/lab.ts"></script>
  </body>
</html>
