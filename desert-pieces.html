<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赤沙古道 · 新件检视</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17151a;color:#efe7d3;font:13px "Microsoft YaHei","PingFang SC",sans-serif}
#view{width:100%;height:100%;display:block;outline:none}
#panel{position:fixed;right:14px;top:14px;width:300px;max-height:calc(100vh - 28px);overflow-y:auto;background:#17151aec;border:1px solid #5a4f40;border-radius:6px;padding:12px 14px;box-sizing:border-box}
#panel h1{font-size:15px;margin:0 0 6px;color:#f6e7c1;letter-spacing:1px}
#panel h2{font-size:12px;margin:12px 0 6px;color:#f5c428;border-bottom:1px solid #4a4032;padding-bottom:3px;font-weight:normal}
#panel .sub{color:#c9b58a;font-size:12px;line-height:1.6}
#panel button{font:inherit;background:#3a3026;color:#f5eedc;border:1px solid #6b5c46;border-radius:3px;padding:4px 8px;margin:2px 2px 2px 0;cursor:pointer}
#panel button.on{background:#f5c428;color:#1c1810;border-color:#f5c428}
#panel label{display:block;margin:3px 0;cursor:pointer}
#hud{position:fixed;left:14px;top:14px;background:#17151ad0;border:1px solid #4a4032;border-radius:4px;padding:7px 10px;line-height:1.6;font-size:12px;white-space:pre-line;pointer-events:none}
body.capture #panel,body.capture #hud{display:none!important}
</style></head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="hud"></div>
<div id="panel">
  <h1>第一章 · 新做的件</h1>
  <div id="pieces"></div>
  <div class="sub" id="note"></div>
  <h2>机位</h2><div id="views"></div>
  <label><input type="checkbox" id="boxes"> 碰撞盒</label>
  <label><input type="checkbox" id="man" checked> 1.8 m 人形参照</label>
</div>
<script type="module" src="/src/dev/desertPiecesLab.ts"></script>
</body>
</html>
