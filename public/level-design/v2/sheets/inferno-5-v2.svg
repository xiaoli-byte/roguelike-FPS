<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 165" role="img"><title>祝融炉心平面图</title><rect width="118" height="165" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">祝融炉心 / 铸神前殿 · 熔铁护城渠上的桥 · 圆形炉心殿</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">110×136m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>祝融炉心 — 铸神前殿 · 熔铁护城渠上的桥 · 圆形炉心殿</title><desc>火狱最深处是祝融的炉心殿：一座直径 48 m、顶高二十多米的圆殿，殿心是熔池，熔池上方吊着一口八米高的青铜巨鼎，四条巨链斜拉到外墙的四个锁扣上；四条熔岩渠从熔池放射到外墙，把地面切成四个象限，沿外墙一圈是留给火麒麟奔驰的环形跑道。殿外一圈熔铁护城渠，只有一座桥。铸神前殿在桥南，整备时能看到护城渠对岸紧闭的熔铁闸门和闸后炉心透出的红光，看不到殿里。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
