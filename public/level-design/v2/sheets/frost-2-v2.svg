<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 159" role="img"><title>冰瀑栈道平面图</title><rect width="208" height="159" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">冰瀑栈道 / 冰河峡谷两岸 · 西岸冰瀑台、东岸栈道坪与瀑顶冰潭</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">200×130m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>冰瀑栈道 — 冰河峡谷两岸 · 西岸冰瀑台、东岸栈道坪与瀑顶冰潭</title><desc>一条冻住的冰河把峡谷劈成两岸，路线在两岸之间来回：先在西岸冰瀑台下作战，过冰桥到东岸贴崖的栈道坪，再沿北桥绕回西侧，登上冰瀑顶上的圆形冰潭。两岸隔着峡谷互相看得见，青鸟可以越过峡谷追人；冰瀑背后藏着一处冰窟。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
