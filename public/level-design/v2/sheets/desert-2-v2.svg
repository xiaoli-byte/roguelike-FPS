  <title>驼铃驿街 — 商队驿站三进 · 货场、水井院与库门前场</title><desc>南门进驿，先穿过堆满货物的驼铃货场，向北进入以水井台为中心的井院，再向东攻入库门前场。每段通道都正对下一场地的地标：货场看见井台，井院看见库门神龛。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
