<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 219" role="img"><title>熔湖堤道平面图</title><rect width="188" height="219" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">熔湖堤道 / 熔岩湖上的蛇形堤道 · 税关墩、锚链墩与宫门码头</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">180×190m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>熔湖堤道 — 熔岩湖上的蛇形堤道 · 税关墩、锚链墩与宫门码头</title><desc>祝融火狱的门户不是一座院子，而是一整片熔岩湖。玩家站在南岸渡口，一眼就能看到整条路线：玄武岩堤道向西北伸进湖里，接上税关墩，再斜着横过湖面到锚链墩，最后笔直北上，靠上宫门码头。湖面上没有一堵墙，每座墩四面都是熔岩；只有宫门码头背靠宫墙。湖心还有一座石龛，宝箱在龛里发光，从渡口就看得见，却要从锚链墩拐一条窄堤才能过去。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
