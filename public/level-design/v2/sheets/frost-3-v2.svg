<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 201" role="img"><title>瑶池冰湖平面图</title><rect width="208" height="201" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">瑶池冰湖 / 湖心枢纽 · 西岸祭坛与东岸船坞自选顺序 · 半圆瑶台</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">200×172m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>瑶池冰湖 — 湖心枢纽 · 西岸祭坛与东岸船坞自选顺序 · 半圆瑶台</title><desc>西王母的瑶池冻成了一整片椭圆冰面，整关以湖心为枢纽：从南面栈桥踏上冰面先打一场开阔的对射；之后西岸祭坛和东岸船坞两场战斗的顺序由玩家自己选，两边都清空，北岸半圆形的瑶台才会有守军现身。湖面没有墙，只有湖心亭和两座小岛。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
