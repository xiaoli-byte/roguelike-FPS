<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 159" role="img"><title>北冥冰台平面图</title><rect width="138" height="159" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">北冥冰台 / 雪岭营地 · 环绕北冥冰窟的环形祭台</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">130×130m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>北冥冰台 — 雪岭营地 · 环绕北冥冰窟的环形祭台</title><desc>昆仑之北就是北冥。冰台是绕着中央冰窟一整圈的环形祭台：北冥的冰海从中间破开，鲲在冰窟里醒来，从冰窟各个方向探头扑咬，整场战斗都在绕着冰窟转；打到一半鲲沉入冰窟，冰海炸开，化成巨鹏升空，在环台上空盘旋俯冲。环台宽约 28 m，没有角落可以背靠。营地在西南方的低处，看不到冰台。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
