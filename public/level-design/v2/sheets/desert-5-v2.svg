<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 165" role="img"><title>沙王仪场平面图</title><rect width="128" height="165" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">沙王仪场 / 商旅补给院 · 八角沙王仪场</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">120×136m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>沙王仪场 — 商旅补给院 · 八角沙王仪场</title><desc>首领关只有两段：在商旅补给院整备，沿一条转一次弯的门楼通道进入八角形的沙王仪场。补给院看不到仪场，进场后巨像立在场地中央，南北两座祭墩、四根巨柱与被砸碎的柱段提供躲避；神龛在仪场东墙，胜利后开启。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
