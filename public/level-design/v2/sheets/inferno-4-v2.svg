<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 189" role="img"><title>鼓风正殿平面图</title><rect width="174" height="189" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">鼓风正殿 / 打两次的鼓风正殿 · 熔渊悬炉锻台 · 东风道回环</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">166×160m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>鼓风正殿 — 打两次的鼓风正殿 · 熔渊悬炉锻台 · 东风道回环</title><desc>祝融的大炉靠一座鼓风正殿供风：殿里卧着两台巨型风箱，把大殿分成南北两条风箱道，殿西是大炉的炉门。玩家从南门进殿，先打一场；穿过北门的链桥，登上吊在熔渊上的悬炉锻台，拉开风闸；再沿锻台东侧的链桥进入东风道，顺着风道绕回正殿东北角。这时风箱已经鼓起来，炉门大开，殿里换了一批守军——同一座殿，第二次从另一个门进来，打的是另一场仗，出口就是殿西的炉门。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
