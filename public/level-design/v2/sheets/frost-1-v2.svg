<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 181" role="img"><title>玉阶雪关平面图</title><rect width="158" height="181" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">玉阶雪关 / 三层白玉台地 · 之字形仰攻天门</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">150×152m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>玉阶雪关 — 三层白玉台地 · 之字形仰攻天门</title><desc>昆仑山门不是一座院子，而是一整面山坡上层层叠起的白玉台地。玩家在下层台由西向东横穿，从东端台阶登上中层台，再由东向西折返，最后登上收窄成漏斗的天门广场，出口就是天门本身。每一层的北缘都是上一层的挡土墙，狌狌会从上面翻下来；中层台完全露天，青鸟从山上俯冲。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
