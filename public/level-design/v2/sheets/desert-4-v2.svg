<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 201" role="img"><title>错门寺城平面图</title><rect width="158" height="201" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">错门寺城 / 三进寺院 · 习武庭、旗庭与正殿庭</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">150×172m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>错门寺城 — 三进寺院 · 习武庭、旗庭与正殿庭</title><desc>寺城的院门从不对齐：南候场向北进习武庭，出门却要向东绕进旗庭，再从旗庭北门进正殿庭，神龛嵌在正殿北墙。每道院门都由门楼框住下一院的地标：习武庭望见旗台，旗庭望见正殿神龛。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
