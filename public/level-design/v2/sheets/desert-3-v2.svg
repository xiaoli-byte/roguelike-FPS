<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 189" role="img"><title>沉沙围城平面图</title><rect width="168" height="189" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">沉沙围城 / 围城三段 · 西瓮城、北城楼与东南门前</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">160×160m · 网格5m · V2 重设计 · 含高台与台阶 · 运行时复测</text><g transform="translate(0 12)">
  <title>沉沙围城 — 围城三段 · 西瓮城、北城楼与东南门前</title><desc>从南城缺口钻进被流沙半埋的围城：先在西瓮城里躲开被困的镇墓兽，再向东顶着炮火攻上北城楼前的炮台，最后折向南面的东南门前，神龛在门洞尽头。路线呈 U 形，每次转向都由门楼框出下一场地。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
