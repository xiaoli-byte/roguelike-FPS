<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 173" role="img"><title>错门寺城平面图</title><rect width="170" height="173" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">错门寺城 / 错位五院 · 僧廊与礼道双回接</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">162×144m · 网格5m · 平层底图 · 扩展布局与战前补给 · 运行时复测</text><g transform="translate(0 12)">
  <title>错门寺城 — 错位五院 · 僧廊与礼道双回接</title><desc>五进庭院保留不同门位，院间间距扩大为可读的门厅与礼道；西僧廊绕水庭，北礼道绕巡守院。消除原北礼道2米短折，出口后廊使用宽转向平台。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
