  <title>错门寺城 — 五庭递进 · 错位院门与侧廊</title><desc>五个方庭沿西南至东北阶梯状错列。每一进的出入口分置不同边角，玩家先看院内再寻找下一道门；西侧僧廊和北侧礼道各切过一进，形成长短不同的两次取舍。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
