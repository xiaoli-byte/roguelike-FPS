  <title>风口裂隘 — 宽峡折返 · 脊后探索与战后回接</title><desc>西南宽峡先折向狭口战场，再由分开的沙盆与东北门庭收束；北绕脊和东藏箱湾形成前后两段不同的探索回接，不能把整张图读成一条折线。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
