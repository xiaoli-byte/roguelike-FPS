  <title>松间巡礼道 — 松林双回环 · 林缘与祈雪堂</title><desc>南林地经宽巡礼空地进入祈雪堂；松根侧径回到堂西，东侧库沿雪脊接回山口。两段探索分别发生在林地和堂外，角色不会被连续小折角挤住。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
