  <title>折冰长廊 — S 形折返 · 用转角与分组控制接战节奏</title><desc>冰壁将地图折成三条交替方向的长廊。主路沿底部向东、折返向西，再从北侧绕向终点；入口附近的小裂缝可直接插入中段，形成一条高风险短径。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
