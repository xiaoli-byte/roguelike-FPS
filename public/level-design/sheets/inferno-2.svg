<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 151" role="img"><title>锯齿排炉街平面图</title><rect width="118" height="151" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">锯齿排炉街 / 一条斜向主街 · 三个装卸盲舱与一段后勤侧线</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">110×122m · 网格5m · 平层底图 · 白盒试玩已认可 · 场景美术阶段</text><g transform="translate(0 12)">
  <title>锯齿排炉街 — 一条斜向主街 · 三个装卸盲舱与一段后勤侧线</title><desc>运煤街从西北斜向东南贯穿厂区，卸灰舱、上料舱、渣箱舱分别插在主街不同侧。它们是功能和风险不同的盲端；只有入口段有一条后勤回接巷，不构成双街梯架。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
