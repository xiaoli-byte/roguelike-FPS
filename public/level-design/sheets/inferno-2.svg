  <title>锯齿排炉街 — 煤街三支舱 · 深浅收益分层</title><desc>运煤主街以宽操作坪为中心，卸灰盲湾、上料炮舱、南渣舱在三个方向分开；后勤巷只负责第二个进场方向，不把所有工业房间连成同一种圆环。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
