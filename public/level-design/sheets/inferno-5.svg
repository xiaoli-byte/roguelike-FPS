<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 117" role="img"><title>黑炉双腔平面图</title><rect width="122" height="117" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">黑炉双腔 / 首领双战斗腔 · 横向转场与上下回绕</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">114×88m · 网格5m · 平层底图 · 白盒试玩已认可 · 场景美术阶段</text><g transform="translate(0 12)">
  <title>黑炉双腔 — 首领双战斗腔 · 横向转场与上下回绕</title><desc>西侧冷炉腔和东侧燃烧腔以宽喉道相连，北侧散热廊、南侧冷却湾形成两条完整绕行线。首领战沿横向拉开，入口和离场区位于相反的南侧角落。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
