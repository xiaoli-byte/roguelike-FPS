  <title>雪埋禅院 — 雪院内旋 · 外廊物资与北门捷径</title><desc>北入、西下、南转、东收的内旋院落整体拉开；西廊外转绕开实心掩体，再在南院恢复。北侧短径仍能直入内殿，奖励分布鼓励走完整外廊。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
