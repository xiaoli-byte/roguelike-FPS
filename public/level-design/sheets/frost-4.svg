<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 155" role="img"><title>雪埋禅院平面图</title><rect width="142" height="155" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">雪埋禅院 / 内旋回廊 · 外圈积累优势，内径直面守卫</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">134×126m · 网格5m · 平层底图 · 白盒试玩已认可 · 场景美术阶段</text><g transform="translate(0 12)">
  <title>雪埋禅院 — 内旋回廊 · 外圈积累优势，内径直面守卫</title><desc>入口位于东北，主路先向西，再沿禅院外廊顺时针深入，终点在地图内部。北门与西廊是开口方向不同的 L 形院落，南院有外伸回廊，东侧长殿接向带北龛的内殿。北门残隙另有直达内殿的短径。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
