<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 133" role="img"><title>沙王仪场平面图</title><rect width="134" height="133" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">沙王仪场 / 偏置扇形斗场 · 单体首领考验</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">126×104m · 网格5m · 平层底图 · 白盒试玩已认可 · 场景美术阶段</text><g transform="translate(0 12)">
  <title>沙王仪场 — 偏置扇形斗场 · 单体首领考验</title><desc>西南狭长候场厅通往向东北展开的扇形仪场；出口偏在东北肩部。斗场两枚不等距实心祭墩分割射线，四周保持连贯绕行空间。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
