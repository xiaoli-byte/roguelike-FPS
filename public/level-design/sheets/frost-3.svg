<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 141" role="img"><title>冻湖三栈平面图</title><rect width="144" height="141" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">冻湖三栈 / 岸仓与三栈 · 中途换线的湖岸工区</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">136×112m · 网格5m · 平层底图 · 扩展布局与战前补给 · 运行时复测</text><g transform="translate(0 12)">
  <title>冻湖三栈 — 岸仓与三栈 · 中途换线的湖岸工区</title><desc>西岸仓场与北岸绞盘院扩展为宽工作院，岸路在院外转折；东侧三栈保持不同作业形态。中栈U形修船槽、船体操作带和旧奖励点原位保留，横向换线只发生在工作栈桥。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
