<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 141" role="img"><title>冻湖三栈平面图</title><rect width="144" height="141" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">冻湖三栈 / 双脊梯架 · 岸线推进与栈桥侧击</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">136×112m · 网格5m · 平层底图 · 白盒试玩已认可 · 场景美术阶段</text><g transform="translate(0 12)">
  <title>冻湖三栈 — 双脊梯架 · 岸线推进与栈桥侧击</title><desc>西岸 L 形仓场、外伸工坊和长矩形绞盘院构成连续岸路；东侧 T 形炮台、U 形修船槽和长条检修站由外侧便道串联。横向连接只在三处工作区出现，可沿岸推进或从栈桥逐段换线。物资棚是明确的尽头支路。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
