<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 147" role="img"><title>沉沙围城平面图</title><rect width="118" height="147" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">沉沙围城 / 三面城环 · 穿城捷径</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">110×118m · 网格5m · 平层底图 · 白盒试玩已认可 · 场景美术阶段</text><g transform="translate(0 12)">
  <title>沉沙围城 — 三面城环 · 穿城捷径</title><desc>从南侧缺口沿西、北、东三面城环抵达东南出口；城内不是中心枢纽，而是一条把西段直接接往东南的斜穿捷径。城环和穿城线路形成很不相同的交战距离。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
