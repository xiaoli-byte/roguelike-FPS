  <title>沉沙围城 — 宽城环与内街 · 双方向攻门</title><desc>西瓮城、北城楼和东门形成宽度不同的外城环；残屋内街穿过中心，从内外两线侧入东南门场。东落脚弯扩大，内街与城楼之间保留独立回接。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
