<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 196" role="img"><title>断裂输渣线平面图</title><rect width="172" height="196" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">断裂输渣线 / 错位双桥 · 两岸转运探索</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">164×167m · 网格5m · 平层底图 · 扩展布局与战前补给 · 运行时复测</text><g transform="translate(0 12)">
  <title>断裂输渣线 — 错位双桥 · 两岸转运探索</title><desc>西转运站与东接料坪拉开，双桥仍错位；中桥直达，北桥先经过大检修院，东岸落脚后经宽折带再向出渣闸收束。工作桥只作位移不作刷怪走廊。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
