  <title>断裂输渣线 — 双岸双桥 · 短跨越与远端包抄</title><desc>不可通行的输渣隔离带把地图分成两岸。中桥直接连接首个战区，北桥绕远接近敌人侧面；终点位于东岸南端，形成明显错位的出入口。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
