<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 149" role="img"><title>三角铸炉围场平面图</title><rect width="134" height="149" fill="#edf2f5"/><text style="text-anchor:start" x="4" y="5" font-family="Microsoft YaHei,sans-serif" font-size="3" fill="#294455">三角铸炉围场 / 三角外缘回路 · 一条斜穿炉体的检修短廊</text><text style="text-anchor:start" x="4" y="9" font-family="Microsoft YaHei,sans-serif" font-size="1.7" fill="#526978">126×120m · 网格5m · 平层底图 · 白盒试玩已认可 · 场景美术阶段</text><g transform="translate(0 12)">
  <title>三角铸炉围场 — 三角外缘回路 · 一条斜穿炉体的检修短廊</title><desc>三角形炉体把厂区分为南侧散热货场、东侧模具堆场与北侧总控场。外缘道路闭合，西侧维修间形成回程边；检修短廊从南货场斜穿炉体抵达北端，不形成内旋通路。。单位为米。对应技术白盒已接入独立试玩入口，完整可玩性与平衡仍在验证。</desc>
