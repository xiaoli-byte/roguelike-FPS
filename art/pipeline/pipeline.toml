# 美术资产管线 · 全局配置
# 规范说明见 art/README.md。单个资产的规格写在 registry.toml。

[paths]
source = "art/source"              # 源资产（白模、概念、高模、DCC 工程、审核图）
runtime = "public/assets"          # 引擎可直接加载的发布目录（Vite 原样拷贝）
manifest = "public/assets/manifest.json"

[tools]
blender = "C:/Program Files/Blender Foundation/Blender 5.2/blender.exe"
comfyui_url = "http://127.0.0.1:8188"
comfyui_output = "C:/Users/admin/ComfyUI/output"
receiver_port = 8766               # 白模接收端口（src/dev/artExport.ts 里写死同一个值）

# ───────────── 概念设计（2D）─────────────
[concept]
# 2026-10-07 起改用本机 Codex CLI（ChatGPT 账号登录，不耗 API 额度）；改回 "openai" 即走 API。
provider = "codex"
codex_model = "gpt-6.1-sol"         # 最新主力模型（Codex CLI 0.160.1 起可用）
model = "gpt-image-2.5-sunburst"   # 精修档：编辑时最贴合参考图；快速试稿可改 gpt-image-2.5-flare
quality = "high"
sheet_size = [2048, 1024]          # 四视图一行：正 / 左 / 背 / 右，每格 512×1024
# 全项目统一美术方向：以《枪火重生》级别的风格化游戏效果为目标。
# concept 命令自动前置；本机环境批次的 ImageGen 调用需显式前置这一段，
# 登记脚本只保存实际提示词，不替换历史原图或提示词。
style = """
Stylized hand-painted 3D game character art for a fast first-person roguelite shooter, targeting
the readable, moderate-detail visual direction of Gunfire Reborn. Bold chunky silhouettes,
slightly exaggerated proportions, broad clean faceted planes, two or three dominant color blocks,
soft painted gradients and a few restrained edge accents. Simplify East-Asian fantasy motifs
into recognizable medium-scale shapes. Use the chapter or character palette in the asset brief.
Favor clear solid volume and consistent materials at normal gameplay distance. Matte stone,
wood and cloth, restrained highlights on metal, sparse painted wear. No photorealism,
micro-grain, dense tiny cracks, elaborate miniature carvings, harsh specular highlights or
baked cast shadows. Even neutral lighting for reconstruction; prioritize silhouette and color
coherence over surface detail.
"""

# ───────────── 高模（Hunyuan3D 2.1，本地 ComfyUI）─────────────
[highpoly]
checkpoint = "hunyuan_3d_v2.1.safetensors"
checkpoint_mv = "hunyuan3d-dit-v2-mv_fp16.safetensors"   # 多视图模式（tencent/Hunyuan3D-2mv，fp16）
latent_resolution_mv = 3072
steps = 50
cfg = 5.0
shift = 1.0
octree_resolution = 384
num_chunks = 32000
threshold = 0.6
seed = 20261003
input_size = 1024                  # 输入图：正方形、白底、主体占画面 85%
input_fill = 0.85

# ───────────── Blender 处理 ─────────────
[build]
bake_device = "GPU"                # GPU 不可用时自动退回 CPU
ao_samples = 64
bake_margin_px = 16
cage_extrusion = 0.015             # 相对资产高度
projection_sharpness = 3.0         # 多视图投影按法线朝向加权的指数
max_bone_influences = 4

[export]
draco = true
image_format = "WEBP"
tangents = true

# ───────────── 规格档（按资产类别）─────────────
# lod_tris：各级 LOD 三角面上限；lod_distance：切换距离（米，LOD0 从 0 开始）
# texture：贴图边长；texel_density：目标像素/米（只做提示）
[classes.enemy_standard]
category = "characters"
lod_tris = [8000, 3500, 1500]
lod_distance = [0, 14, 30]
texture = 1024
texture_hi = 2048                  # 画质「高」时加载的高清贴图版本（<资产>@hi.glb）
texel_density = 512
max_file_kb = 1600

# 群怪（3–5 只同屏、体型小）：面数比普通敌人低一档，细节靠贴图
[classes.enemy_swarm]
category = "characters"
lod_tris = [6000, 2500, 1000]
lod_distance = [0, 12, 26]
texture = 1024
texture_hi = 2048                  # 画质「高」时加载的高清贴图版本（<资产>@hi.glb）
texel_density = 512
max_file_kb = 1600

# 灵宠（docs/pet-system.md）：一直跟在玩家身边、离镜头近，比同体型的小怪多给面数
[classes.pet]
category = "characters"
lod_tris = [8000, 3500, 1500]
lod_distance = [0, 14, 30]
texture = 1024
texture_hi = 2048                  # 画质「高」时加载的高清贴图版本（<资产>@hi.glb）
texel_density = 512
max_file_kb = 1600

# 灵宠的独立部件（精卫嘴里的火石：玩法里会被投出 / 隐藏，所以不和身体熔成一块）：静态网格，原点 = 包围盒中心
[classes.pet_attachment]
category = "attachments"
lod_tris = [1200, 400]
lod_distance = [0, 14]
texture = 512
texel_density = 1024
max_file_kb = 400

# 神兽（白泽、应龙）：体型大、是一局的高光，给到大型敌人的规格
[classes.pet_mythic]
category = "characters"
lod_tris = [12000, 5000, 2000]
lod_distance = [0, 18, 40]
texture = 2048
texel_density = 512
max_file_kb = 3000

# A single hero fills the selection stage, including broad tails / wings.
[classes.hero_display]
category = "characters"
lod_tris = [16000, 6000, 2400]
lod_distance = [0, 10, 24]
texture = 2048
texel_density = 1024
max_file_kb = 3200

[classes.enemy_large]
category = "characters"
lod_tris = [12000, 5000, 2000]
lod_distance = [0, 18, 40]
texture = 2048
texel_density = 512
max_file_kb = 3000

[classes.boss]
category = "characters"
lod_tris = [30000, 12000, 5000]
lod_distance = [0, 25, 60]
texture = 2048
texel_density = 512
max_file_kb = 6000

# 英雄选人演出用的形态挂件（磐的鳞球）：近距离展示，单独模型，原点 = 包围盒中心
[classes.hero_attachment]
category = "attachments"
lod_tris = [6000, 2000]
lod_distance = [0, 14]
texture = 1024
texel_density = 1024
max_file_kb = 900

[classes.enemy_attachment]
category = "attachments"           # 敌人挂点上的武器 / 盾 / 法器（静态网格，原点 = 挂点）
lod_tris = [3000, 1000]
lod_distance = [0, 14]
texture = 1024
texel_density = 1024
max_file_kb = 700

[classes.boss_attachment]
category = "attachments"           # Boss 挂点上的大型武器（静态网格，原点 = 挂点）：体量大、Boss 战里离镜头近，预算高于普通挂件
lod_tris = [6000, 2000]
lod_distance = [0, 25]
texture = 2048
texel_density = 1024
max_file_kb = 1500

[classes.fp_arm]
category = "weapons"               # 第一人称手臂（每位英雄一套左右手，静态网格挂在 Viewmodel 的 arm_r / arm_l 挂点）
lod_tris = [8000, 2000]
lod_distance = [0, 6]
texture = 2048
texel_density = 2048
max_file_kb = 1500

[classes.weapon_fp]
category = "weapons"
lod_tris = [12000, 3000]
lod_distance = [0, 6]
texture = 2048
texel_density = 2048
max_file_kb = 3000

[classes.prop]
category = "props"
lod_tris = [2500, 900]
lod_distance = [0, 20]
texture = 512
texel_density = 256
max_file_kb = 600

# Hunyuan 自然环境件：bounds-only 尺寸参考，不创建白模网格。
[classes.nature_prop]
category = "props"
lod_tris = [5000, 1600, 500]
lod_distance = [0, 18, 42]
texture = 1024
texel_density = 256
max_file_kb = 900
bake_device = "CPU"                # 不与 Hunyuan 推理抢显存
min_component_fraction = 0.002     # 保留生成的较小枝叶和积雪块
remesh_voxel = 0.0018              # 只修整 Hunyuan 网格，避免吞掉细枝
min_reference_span_fraction = 0.25 # 拒绝只有正面轮廓、几乎无三维厚度的失败生成
far_lod_budget_weld_max_fraction = 0.015 # 仅最远 LOD 小拓扑环阻塞减面时，最多焊接高度的 1.5%

# ───────────── Tripo Studio 资产（P2.0 智能网格：游戏级低模 + 供应方 PBR 贴图）─────────────
# 来源模型已是低模并自带贴图，构建只做对齐、减面出 LOD、贴图降到预算与压缩，不再从概念投影上色。
# Tripo 的 UV 碎成很多小岛，深度减面会跨岛把贴图拉成斜条纹：减面后 UV 拉伸面积超过 lod_rebake_stretch 的 LOD
# 自动重展 UV，从 LOD0 烘焙自己的 BC / N / ORM（边长按面数占比缩小，如 800 面 → 512²），材质 M_<名>_LOD<i>。
[classes.tripo_architecture]
category = "props"
lod_tris = [8000, 2500, 800]
lod_distance = [0, 24, 60]
texture = 2048
texel_density = 128
max_file_kb = 1600
lod_rebake_stretch = 0.02          # 1% 时 2500 面的 LOD1 也会重烘（1024²），烽燧 GLB 会到 1.8 MB，超出 max_file_kb

# derive_wall_kit.py 从整段城墙切出的墙板 / 端头（只写进 manifest，不在 registry 登记）：
# 每块都是母件的一部分，预算沿用母件 tripo_architecture，供 Unity 侧 QA 检查。
[classes.tripo_architecture_kit]
category = "props"
lod_tris = [8000, 2500, 800]
lod_distance = [0, 24, 60]
texture = 2048
texel_density = 128
max_file_kb = 1600

[classes.tripo_prop]
category = "props"
lod_tris = [3000, 1000]
lod_distance = [0, 20]
texture = 1024
texel_density = 256
max_file_kb = 700
lod_rebake_stretch = 0.02
