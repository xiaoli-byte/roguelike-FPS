blue royal robe with dark navy layers, ornate silver armour plates on the chest and shoulders, pale ice-blue
skin, slender arms with silver bracers and icy claws, two large wings each made of four long translucent
ice-crystal feathers, an ice crystal crown with glowing gems, glowing cyan eyes, a glowing frost core on the
chest, floating ice shards around her.
"""

