# ───────────── 毛发 / 羽毛（按画质：低 = 无；中 = 着色细节；高 = 再叠壳层，docs/unity-art-pipeline.md「毛发」）─────────────
# Unity 导入时 FurBake 按骨架与蒙皮权重烘毛向（躯干 / 颈 / 头往后顺，四肢、尾巴、耳朵顺到末端）和遮罩，FurShells 按画质给 LOD0 叠壳层。
#   kind = "fur" | "feather"；length = 最长处毛长（米，缺省身高 × 2% / 羽 1.2%）；density = 每米发丝格数（缺省 1 / (0.35 × length)）；
#   shells = 画质「高」的层数（缺省毛 10 / 羽 6）；comb / droop = 顺毛梳 / 重力下垂；detail / sheen / fuzz = 画质「中」的发丝明暗 / 光泽 / 绒边；
#   bones = { 骨骼名通配 = 毛长倍数 }（0 = 不长毛：爪、蹄、喙、铃铛…）；exclude = [{ center, radius }]（骨架坐标：front = -Y，左 = +X，up = +Z；眼睛、鼻口）。
# 改了以后：python art/pipeline/unity_export.py <ID> → Unity Sync（sidecar 的 fur 变了会自动重新导入模型）。

