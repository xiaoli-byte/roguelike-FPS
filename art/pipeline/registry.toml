# 资产登记表（Asset Registry）
#
# 每个资产一节，键名就是资产 ID，必须符合命名规范：
#   SK_<类>_<名>  骨骼网格（会被游戏骨骼驱动）   SM_<类>_<名>  静态网格
# 字段：
#   display   中文名
#   kind      skeletal | static
#   class     规格档，见 pipeline.toml [classes.*]
#   blockout  白模来源：{ source = "enemy", id = <EnemyDef.id> }
#   material  材质参数。有材质分区（assetctl.py matid）时：roughness = 非金属区粗糙度，
#             metal_roughness / metal_value = 金属区粗糙度 / 金属度（默认 0.4 / 0.75，手绘固有色里已经画了明暗，不宜过高）；
#             没有材质分区时退回 roughness / metallic 两个全局常量
#   brief     设定描述（英文，给概念阶段；风格统一写在 pipeline.toml [concept].style）
#   keep_glow 运行时保留白模上哪些发光部件（"all" | "attachments" | "none"），默认 attachments。
#             敌人一律用 all：眼睛 / 面甲缝是攻击前摇的发光提示（设计支柱「可读的敌人」），不能丢
#   qa_waivers QA 豁免（可选）：{ "<检查项名>" = "<理由>" }，有意的设计偏差不阻塞流程，校验报告里记为「已豁免」
#   lod_tris  覆盖规格档的各级 LOD 面数上限（可选，[LOD0, LOD1, …]）
#   lod_rebake_stretch  Tripo 静态件：减面后 UV 拉伸面积超过它的 LOD 重展 UV 烘焙（可选，默认取规格档，见 pipeline.toml）
#   rig       绑定方式（可选）："parts" = 通用部件骨架（非人形敌人 / Boss）：骨骼是程序化模型的每个节点，
#             权重按离哪个白模部件最近生成；rig_sigma = 部件交界处的过渡带宽度（相对资产尺寸，默认 0.015，越小越刚性）
#   rig_rigid  部件骨架的刚体分段（石像、甲壳、板甲、灯笼等硬表面角色）：每个部件 100% 跟随自己的骨骼，所有部件交界切开并封口，
#             关节转动时露出部件之间的缝而不是拉伸；默认 false = 父子部件（及纯枢轴下的兄弟部件，如腰）之间平滑过渡、其余部件交界切开
#   rig_rigid_joints  过渡模式里单独设为刚性的关节（rig 字段名列表）：与父、兄弟关节的交界切开，和子关节照常过渡
#   emissive_hint  发光分区（emid）的资产说明：哪些细节会发光（雕刻纹路、符文、散热缝）；运行时按实例着色
#   highpoly_mode  "single"（默认，Hunyuan3D 2.1 正面单图）| "multiview"（Hunyuan3D 2mv 四视图，深度由侧视图约束）
#   rom        ROM（活动范围）测试姿势表 [assets.<ID>.rom]：{姿势名 = {rig 字段 = [x, y, z]}}，取自招式代码的极限角度，审核阶段按它做形变检测
#   arm_radius 人形手臂链的影响半径（米，默认 0.14）：超出的顶点与肩关节内侧的顶点归躯干，防止抬手时把身体 / 斗篷带起来；
#             宽袖、大肩甲角色要调大
#   matid_hint 材质分区的补充说明（可选，英文），追加到遮罩提示词：模型容易把浅黄的骨壳 / 砂岩当成铜
#   garment   绑定规格（可选）："long_robe" 长袍盖住双腿：脚踝到髋部按「髋骨 + 左右平均」绑定，防止袍内的腿戳出、袍摆撕开

