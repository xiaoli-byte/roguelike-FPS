brief = """The broken END piece of the SAME Han-dynasty Great Wall rammed-earth wall as the straight segment, built exactly the same way, only collapsing at one end. PROPORTIONS: in the FRONT and BACK views it is a very long, low wall, 8m long and only 3.5m tall at its highest, so its drawn width is 2.3 times its drawn height, much wider than tall, like a long low bench; 2.4m thick at the base tapering to 1.6m at the top. Construction: seven broad horizontal rammed-earth courses stacked like thick layers of a cake, each course one continuous monolithic band of compacted earth running the whole length with softly rounded edges, with NO vertical joints, seams, bricks, cut stone blocks or masonry anywhere; between every two courses a thin darker layer of compressed reeds and tamarisk branches with chunky stub ends. The courses alternate ochre-red and pale sand-yellow earth, the reed layers are khaki-brown. In the FRONT view the LEFT half of the length (a full 4m, half of the wall) stands at the full 3.5m height with a softly eroded, gently uneven rounded crest and a flat vertical cut end face at the far left that joins a straight segment; only past the middle, across the RIGHT half, does the wall break down in a long, shallow staircase collapse where the courses peel back one by one, each higher course ending a little further left than the course below it, every step a rounded eroded earth ledge with its reed layer showing as the step edge, down to a low stump of the two bottom courses about 1m high at the right end. At the foot of the collapse, inside the 8m length, lie two large fallen chunks of the same layered rammed earth: thick slabs with the same reed-layer stripe across them and soft rounded broken edges, not square stones. The BACK view is the FRONT view mirrored, with the same long low proportions: collapse on the image-left, intact full-height half on the image-right. Both side views share the same outline, a tapered trapezoid 2.4m wide at the base, 1.6m wide at the top and 3.5m tall: the LEFT side view looks at the collapsed end and shows the low stepped stump and the fallen chunks in front of that full-height tapered profile; the RIGHT side view looks at the intact end and shows the flat cut end face with the seven course bands and reed layers. Broad faceted planes, low-poly chunky forms, two or three colour blocks, no small debris, pebbles or micro cracks. One solid connected piece on a flat base, no openings."""

