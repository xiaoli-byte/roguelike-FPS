ge-left showing its plank tailboard, rib cage on the image-right closest to the camera, skull at the far right; LEFT side view (looking from the cart's wheel side) - the cart in front with its shafts pointing to the image-left and one wheel seen face-on, the rib tops just visible behind the cart toward the image-right; RIGHT side view (looking from the skeleton side) - the rib cage seen end-on in front on the image-left with the skull facing the camera, the cart behind it with its shafts pointing to the image-right. Weathered grey-brown timber, faded terracotta and indigo cloth, pale ivory bone, sand-yellow drift. Chunky simplified shapes at Gunfire Reborn fidelity, broad faceted planes, two or three dominant colour blocks, no thin spokes, loose ropes, thin or fine bones, flags, cloth banners or scattered debris; everything touching as one solid connected cluster on a flat base."""


