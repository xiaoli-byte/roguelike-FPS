brief = """A medium wind-eroded yardang rock mound 9m tall, 6.5m wide and 16m long, its long axis running front-to-back along the wind, made of the same rock as a big ship-shaped yardang ridge: bold, perfectly horizontal sediment strata in alternating ochre-red and pale sand-yellow bands, each band a broad flat stripe that wraps all the way around at the same height on every side. Shape: one massive flat-topped loaf-like rock body, NOT a slender pillar or tower and NOT a ramp or wedge. The top is a broad, almost level flat plateau: a full 9m high from the front head over the front three quarters of the length, then one low step down by about 1.5m over the last quarter to the tail at the BACK end. The side walls are steep and near-vertical with slightly rounded upper edges, carved by a few broad vertical wind flutes and grooves. Along the foot a continuous shallow horizontal undercut groove runs all around like a waterline notch, a recessed band about 1m tall; no arches, caves, holes or separate legs, the rock sits solidly on the ground along its whole length. The FRONT is the blunt rounded upwind head. EXACT VIEW PROPORTIONS, all four views drawn at the same 9m height: FRONT and BACK views show the 6.5m narrow end, drawn clearly taller than wide (width about 0.7 of the height), a sturdy upright mass with a broad flat top nearly as wide as the base, only slightly rounded shoulders and sides that flare a little outward to the footing, the horizontal bands running straight across it; the BACK outline is the FRONT outline mirrored at the same full height, because the taller head still shows behind the lower tail step, which appears as a lower ledge in front. LEFT and RIGHT side views show the long 16m profile, drawn 1.8 times as long as tall (never longer), the two side views exact mirror images of each other: a nearly horizontal top line with the blunt head at the front end and the single low step down near the back end, the horizontal bands parallel to the ground, never diagonal. Broad faceted hand-painted planes, chunky readable forms, two or three colour blocks, no tiny cracks, pebbles, vegetation or man-made parts. One solid rock mass on a flat base."""

